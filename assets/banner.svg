<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Gemini Antigravity for Hermes Agent</title>
  <desc id="d">A four-point star floating above a ring, beside the plugin's name, the models it offers and its install command.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="haloA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a265ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a265ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#9b72ff"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b72ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9b72ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#08090d"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="985" cy="300" r="330" fill="url(#haloA)"/>
  <circle cx="1120" cy="470" r="260" fill="url(#haloB)"/>

  <!-- emblem: a star floating above a ring -->
  <g transform="translate(985 320)">
    <ellipse cx="0" cy="132" rx="210" ry="40" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
    <ellipse cx="0" cy="132" rx="150" ry="28" fill="none" stroke="url(#ring)" stroke-width="1" stroke-opacity="0.6"/>
    <ellipse cx="0" cy="132" rx="90" ry="16" fill="url(#shadow)"/>
    <g transform="translate(0 -62)">
      <path d="M0 -130 C 9 -50 50 -9 130 0 C 50 9 9 50 0 130 C -9 50 -50 9 -130 0 C -50 -9 -9 -50 0 -130 Z" fill="url(#spark)"/>
      <path d="M0 -130 C 9 -50 50 -9 130 0 C 50 9 9 50 0 130 C -9 50 -50 9 -130 0 C -50 -9 -9 -50 0 -130 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    </g>
    <circle cx="-168" cy="-120" r="3" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="176" cy="-70" r="2" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="140" cy="-170" r="1.6" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <!-- eyebrow -->
    <rect x="80" y="132" width="246" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="100" cy="149" r="4" fill="#5bd68a"/>
    <text x="114" y="155" font-size="16" font-weight="500" fill="#c8ccd8" letter-spacing="0.3">Hermes Agent provider</text>

    <!-- title -->
    <text x="76" y="262" font-size="86" font-weight="700" fill="#ffffff" letter-spacing="-3">Gemini</text>
    <text x="76" y="354" font-size="86" font-weight="700" fill="#ffffff" letter-spacing="-3">Antigravity</text>
    <rect x="80" y="380" width="72" height="4" rx="2" fill="url(#accent)"/>

    <text x="80" y="428" font-size="22" fill="#8b90a0">Your Google Antigravity subscription in Hermes.</text>
    <text x="80" y="458" font-size="22" fill="#8b90a0">Direct OAuth 2.0 sign-in. No CLI, no dependencies.</text>

    <!-- install -->
    <rect x="80" y="500" width="430" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="102" y="533" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" fill="#e6e8ef"><tspan fill="#5bd68a">$</tspan> npx hermes-gemini-antigravity</text>
  </g>
</svg>

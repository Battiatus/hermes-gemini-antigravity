<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Gemini Antigravity for Hermes Agent</title>
  <desc id="d">A winged messenger's wing lifting a four-point star along orbit lines, beside the plugin's name.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#1d1238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ab4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="0.5" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9963a"/>
      <stop offset="1" stop-color="#ffe2a0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="70" r="1.6" opacity="0.7"/><circle cx="210" cy="140" r="1.1" opacity="0.5"/>
    <circle cx="340" cy="60" r="1.4" opacity="0.6"/><circle cx="520" cy="110" r="1" opacity="0.4"/>
    <circle cx="690" cy="50" r="1.5" opacity="0.6"/><circle cx="860" cy="95" r="1.1" opacity="0.5"/>
    <circle cx="1010" cy="40" r="1.6" opacity="0.7"/><circle cx="1190" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="1240" cy="300" r="1.3" opacity="0.5"/><circle cx="1130" cy="560" r="1.5" opacity="0.6"/>
    <circle cx="930" cy="600" r="1" opacity="0.4"/><circle cx="640" cy="590" r="1.4" opacity="0.5"/>
    <circle cx="60" cy="560" r="1.2" opacity="0.5"/><circle cx="150" cy="420" r="1" opacity="0.4"/>
  </g>

  <!-- emblem -->
  <g transform="translate(330 330)">
    <circle r="230" fill="url(#glow)"/>
    <g fill="none" stroke="#8ab4ff" stroke-linecap="round">
      <ellipse rx="215" ry="70" transform="rotate(-18)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse rx="175" ry="52" transform="rotate(24)" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 10"/>
    </g>
    <circle cx="204" cy="-66" r="6" fill="#ffe2a0"/>
    <circle cx="-150" cy="-72" r="4" fill="#b48cff"/>

    <!-- wing (left), feathers fanning up and back -->
    <g fill="url(#gold)" stroke="#0b1026" stroke-width="3" stroke-linejoin="round">
      <path d="M-20 10 C -90 -10 -160 -70 -200 -150 C -150 -120 -90 -95 -30 -60 Z"/>
      <path d="M-25 30 C -105 25 -185 -15 -235 -85 C -175 -70 -105 -50 -35 -25 Z"/>
      <path d="M-28 50 C -110 60 -190 40 -245 -10 C -180 -5 -110 5 -38 10 Z"/>
      <path d="M-28 68 C -100 90 -170 90 -225 60 C -165 55 -100 50 -36 40 Z"/>
    </g>
    <!-- wing (right), mirrored -->
    <g fill="url(#gold)" stroke="#0b1026" stroke-width="3" stroke-linejoin="round" transform="scale(-1 1)">
      <path d="M-20 10 C -90 -10 -160 -70 -200 -150 C -150 -120 -90 -95 -30 -60 Z"/>
      <path d="M-25 30 C -105 25 -185 -15 -235 -85 C -175 -70 -105 -50 -35 -25 Z"/>
      <path d="M-28 50 C -110 60 -190 40 -245 -10 C -180 -5 -110 5 -38 10 Z"/>
      <path d="M-28 68 C -100 90 -170 90 -225 60 C -165 55 -100 50 -36 40 Z"/>
    </g>

    <!-- four-point star -->
    <path d="M0 -125 C 10 -45 45 -10 125 0 C 45 10 10 45 0 125 C -10 45 -45 10 -125 0 C -45 -10 -10 -45 0 -125 Z"
          fill="url(#star)" stroke="#0b1026" stroke-width="4" transform="translate(0 15)"/>
  </g>

  <!-- text -->
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="640" y="250" font-size="30" font-weight="600" letter-spacing="6" fill="#ffe2a0">HERMES AGENT · PROVIDER</text>
    <text x="636" y="335" font-size="74" font-weight="800" fill="url(#title)">Gemini</text>
    <text x="636" y="415" font-size="74" font-weight="800" fill="url(#title)">Antigravity</text>
    <text x="640" y="475" font-size="26" fill="#aab6e0">Your Antigravity subscription in Hermes.</text>
    <text x="640" y="512" font-size="26" fill="#aab6e0">Google OAuth 2.0 · no CLI · no dependencies</text>
  </g>
</svg>

name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m unittest discover -s tests -v
      - run: node --test bin/
      - run: node bin/install.js --home hermes-home && python -c "import pathlib; assert pathlib.Path('hermes-home/plugins/gemini-antigravity/plugin.yaml').exists()"
